<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMR Log</title>
<meta name="theme-color" content="#0E6B47">
<meta name="description" content="Log diesel, repairs, delays and deliveries for VMR Trucking.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VMR Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEB; --surface:#FFFFFF; --ink:#151816; --muted:#59605C; --line:#CDD2CE;
  --sign:#0E6B47; --sign-ink:#FFFFFF; --amber:#F2B705; --amber-ink:#1A1400;
  --warn:#9A3412; --warn-bg:#FDEBDD; --ok:#0E6B47;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A18; --surface:#222725; --ink:#F1F3F1; --muted:#A4ABA7; --line:#37403B;
    --sign:#12804F; --warn:#FDBA8C; --warn-bg:#3B2416; --ok:#5BD69A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A18; --surface:#222725; --ink:#F1F3F1; --muted:#A4ABA7; --line:#37403B;
  --sign:#12804F; --warn:#FDBA8C; --warn-bg:#3B2416; --ok:#5BD69A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}

/* Header styled like a highway guide sign */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:5px}
.sign-inner{border:2px solid rgba(255,255,255,.9);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:0;opacity:.9;margin-top:4px}
.sync{font-size:13px;text-align:right;opacity:.92;max-width:9em}
.sync b{display:block;font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin:14px 0 12px}
.seg button{border:0;background:transparent;padding:10px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.stats{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .sub{font-size:13px;color:var(--muted);margin-top:2px}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--amber);color:var(--amber-ink)}100%{}}

.log{display:block;width:100%;margin:14px 0;border:0;border-radius:12px;background:var(--amber);color:var(--amber-ink);padding:18px 16px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.log:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.log .t{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.log .d{font-size:15px;font-weight:500}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:60px;text-align:left;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.tile .ic{font-size:22px;line-height:1}
.tile.later{color:var(--muted);font-weight:500}

h2{font-family:var(--display);font-weight:700;font-size:24px;margin:24px 0 8px}
.day{font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left}
.row .ic{font-size:22px;width:28px;text-align:center}
.row .mid{flex:1;min-width:0}
.row .ttl{font-weight:600}
.row .meta{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}
.badge.ok{background:transparent;color:var(--ok);padding:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease-out;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}.flash{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head h3{font-family:var(--display);font-weight:700;font-size:30px;margin:0}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;min-height:96px;text-align:left}
.cat .ic{font-size:28px}
.cat b{font-family:var(--display);font-size:26px;line-height:1}
.cat span{font-size:13px;color:var(--muted)}
.cat.wide{grid-column:1/-1;min-height:70px;flex-direction:row;align-items:center;gap:12px}

label.f{display:block;margin:0 0 14px}
label.f > span{display:block;font-weight:600;margin-bottom:6px}
label.f > span em{font-style:normal;font-weight:400;color:var(--muted)}
.in{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:18px}
.in:focus{border-color:var(--sign);outline:none}
.money{position:relative}
.money::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:700;font-size:34px;color:var(--muted)}
.money .in{font-family:var(--display);font-weight:700;font-size:40px;padding-left:38px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line);background:var(--surface);border-radius:12px;min-height:110px;padding:10px;font-weight:600;font-size:15px;overflow:hidden}
.ph .ic{font-size:26px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .re{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:3px 8px;border-radius:99px}
.ph.has{border-style:solid;border-color:var(--sign)}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.toggle input{width:26px;height:26px;accent-color:var(--sign)}
.hint{font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin:-4px 0 14px}
.save{width:100%;border:0;border-radius:12px;background:var(--sign);color:var(--sign-ink);padding:16px;font-family:var(--display);font-weight:700;font-size:28px}
.save:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.need{font-size:14px;color:var(--muted);text-align:center;margin-top:8px;min-height:1.4em}

.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-weight:500}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{border:0;padding:0;background:var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.big img{width:100%;border-radius:10px;display:block;margin-bottom:10px}
.del{width:100%;border:2px solid var(--warn);background:transparent;color:var(--warn);border-radius:12px;padding:12px;font-weight:600;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:40;max-width:90vw;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="sign">
    <div class="sign-inner">
      <div class="brand">VMR<small>Trucking log</small></div>
      <div class="sync" id="sync"><b>Connecting…</b></div>
    </div>
  </header>

  <div class="seg" role="group" aria-label="Period">
    <button id="pDay" aria-pressed="false">Today</button>
    <button id="pWeek" aria-pressed="true">This week</button>
  </div>

  <section class="stats">
    <div class="stat" id="totalBox">
      <div class="k">Expenses</div>
      <div class="v" id="total">$0</div>
      <div class="sub" id="breakdown"></div>
    </div>
    <div class="stat">
      <div class="k">Deliveries made</div>
      <div class="v" id="deliv">0</div>
      <div class="sub" id="delayTotal"></div>
    </div>
  </section>

  <button class="log" id="logBtn">
    <div class="t">Log</div>
    <div class="d">Diesel, repair, delay, delivery, other</div>
  </button>

  <nav class="tiles" aria-label="Tools">
    <button class="tile" id="tReceipts"><span class="ic">📷</span>Receipts</button>
    <a class="tile" href="https://www.google.com/maps" target="_blank" rel="noopener"><span class="ic">📍</span>Navigation</a>
    <button class="tile later" data-later="Diesel prices"><span class="ic">⛽</span>Diesel prices</button>
    <button class="tile later" data-later="Accident report"><span class="ic">🚨</span>Accident report</button>
  </nav>

  <h2 id="listTitle">This week</h2>
  <div id="list"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div class="sh-head"><h3 id="shTitle"></h3><button class="x" id="shClose">Close</button></div>
  <div id="shBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const TYPES = {
  diesel:   {label:"Diesel",   icon:"⛽", money:true,  hint:"Receipt + odometer"},
  repair:   {label:"Repair",   icon:"🔧", money:true,  hint:"Receipt + what was fixed"},
  delay:    {label:"Delay",    icon:"⏱️", money:false, hint:"Waiting time"},
  delivery: {label:"Delivery", icon:"📦", money:false, hint:"Load done"},
  other:    {label:"Other",    icon:"🧾", money:true,  hint:"Parking, tolls, misc"}
};
const usd = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const usd0 = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));

let entries = [], period = "week", db = null;

/* ---------- Storage: cloud (artifact db) when available, phone storage otherwise ---------- */
const LS_KEY = "vmr-log-entries-v1";
const local = {
  read(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } },
  write(list){ try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; } catch { return false; } }
};
function setSync(cloud){
  $("#sync").innerHTML = cloud ? "<b>Synced</b>Saved to the cloud" : "<b>On this phone</b>Saved in this browser";
}
function startLocal(){ db = null; entries = local.read(); setSync(false); render(); }
async function connect(){
  try {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return startLocal();
    const d = await c.use("db");
    if (!d) return startLocal();
    db = d; setSync(true);
    db.collection("entries").orderBy("at","desc").limit(500).onSnapshot(
      snap => { entries = snap.docs.map(s => ({...s.data(), id:s.id})); render(); },
      () => { toast("Cloud storage disconnected. New entries save on this phone."); startLocal(); }
    );
  } catch { startLocal(); }
}
async function saveEntry(e){
  if (db) { await db.collection("entries").doc(e.id).set(e); return; }
  const list = local.read().filter(x => x.id !== e.id); list.push(e);
  if (!local.write(list)) throw new Error("Phone storage is full. Delete a few old entries with photos, then save again.");
  entries = list; render();
}
async function deleteEntry(id){
  if (db) { await db.collection("entries").doc(id).delete(); return; }
  const list = local.read().filter(x => x.id !== id); local.write(list); entries = list; render();
}

/* ---------- Periods and totals ---------- */
function dayStart(t = Date.now()){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); }
function inPeriod(e){ return e.at >= (period === "day" ? dayStart() : weekStart()); }
function fmtMins(m){ const h = Math.floor(m/60), r = Math.round(m%60); return h ? `${h} h ${r} min` : `${r} min`; }
function fmtTime(t){ return new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
function fmtDay(t){
  const d0 = dayStart(t), today = dayStart();
  if (d0 === today) return "Today";
  if (d0 === today - 864e5) return "Yesterday";
  return new Date(t).toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
}

function render(){
  $("#pDay").setAttribute("aria-pressed", period === "day");
  $("#pWeek").setAttribute("aria-pressed", period === "week");
  const list = entries.filter(inPeriod).sort((a,b) => b.at - a.at);
  const sums = {diesel:0, repair:0, other:0}; let total = 0, deliveries = 0, delayMins = 0;
  for (const e of list){
    if (TYPES[e.type]?.money && !e.personal){ const a = Number(e.amount)||0; total += a; sums[e.type] = (sums[e.type]||0) + a; }
    if (e.type === "delivery") deliveries++;
    if (e.type === "delay") delayMins += Number(e.mins)||0;
  }
  $("#total").textContent = usd.format(total);
  $("#breakdown").textContent = ["diesel","repair","other"].filter(k => sums[k]).map(k => `${TYPES[k].label} ${usd0.format(sums[k])}`).join(", ") || "Nothing logged yet";
  $("#deliv").textContent = deliveries;
  $("#delayTotal").textContent = delayMins ? `${fmtMins(delayMins)} waiting` : "No delays logged";
  $("#listTitle").textContent = period === "day" ? "Today" : "This week";

  const box = $("#list");
  if (!list.length){ box.innerHTML = `<div class="empty">Nothing logged ${period === "day" ? "today" : "this week"}. Tap Log after your next fuel stop or delivery.</div>`; return; }
  let html = "", lastDay = null;
  for (const e of list){
    const d = dayStart(e.at);
    if (period === "week" && d !== lastDay){ if (lastDay !== null) html += "</ul>"; html += `<div class="day">${esc(fmtDay(e.at))}</div><ul class="list">`; lastDay = d; }
    else if (lastDay === null){ html += `<ul class="list">`; lastDay = d; }
    html += `<li>${rowHtml(e)}</li>`;
  }
  box.innerHTML = html + "</ul>";
}
function rowHtml(e){
  const T = TYPES[e.type] || TYPES.other;
  let right = "", meta = fmtTime(e.at);
  if (T.money) right = `<span class="amt">${usd.format(Number(e.amount)||0)}</span>`;
  if (e.type === "delay") right = `<span class="amt">${fmtMins(e.mins||0)}</span>`;
  const desc = e.location || e.note || "";
  if (desc) meta += ", " + desc;
  let badge = "";
  if (e.review) badge = `<span class="badge">Needs owner review</span>`;
  else if (e.personal) badge = `<span class="badge">Personal</span>`;
  else if (e.sample) badge = `<span class="badge ok">Sample</span>`;
  return `<button class="row" data-id="${esc(e.id)}"><span class="ic">${T.icon}</span><span class="mid"><span class="ttl">${T.label}${e.type==="delivery"&&e.load?" "+esc(e.load):""}</span>${badge}<div class="meta">${esc(meta)}</div></span>${right}</button>`;
}

/* ---------- Sheet ---------- */
function openSheet(title, html){
  $("#shTitle").textContent = title; $("#shBody").innerHTML = html;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").onclick = closeSheet; $("#shClose").onclick = closeSheet;

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); }

/* ---------- Log flow ---------- */
function openPicker(){
  openSheet("What are you logging?", `<div class="cats">${
    Object.entries(TYPES).map(([k,T]) => `<button class="cat${k==="other"?" wide":""}" data-type="${k}"><span class="ic">${T.icon}</span><b>${T.label}</b><span>${T.hint}</span></button>`).join("")
  }</div>`);
  $("#shBody").querySelectorAll(".cat").forEach(b => b.onclick = () => openForm(b.dataset.type));
}

function photoSlot(key, label){
  return `<label class="ph" data-key="${key}"><span class="ic">📷</span>${label}<input type="file" accept="image/*" aria-label="${label}"></label>`;
}
function hhmm(t){ const d = new Date(t); return d.toTimeString().slice(0,5); }

function openForm(type){
  const T = TYPES[type]; const f = {photos:{}};
  let body = "";
  if (T.money) body += `<label class="f"><span>Amount</span><div class="money"><input class="in" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0.00"></div></label>`;
  if (type === "diesel") body += `<div class="photos">${photoSlot("receipt","Receipt photo")}${photoSlot("odometer","Odometer photo")}</div>`;
  if (type === "repair") body += `<div class="photos">${photoSlot("receipt","Receipt photo")}</div>`;
  if (type === "other") body += `<div class="photos">${photoSlot("receipt","Receipt photo")}</div>`;
  if (type === "delivery") body += `<label class="f"><span>Load <em>(optional)</em></span><input class="in" id="fLoad" placeholder="Load 1"></label><div class="photos">${photoSlot("proof","Signed delivery photo")}</div>`;
  if (type === "delay"){
    const now = Date.now();
    body += `<label class="f"><span>Where</span><input class="in" id="fLoc" placeholder="Warehouse or gate"></label>
      <div class="two"><label class="f"><span>Started</span><input class="in" type="time" id="fStart" value="${hhmm(now-36e5)}"></label>
      <label class="f"><span>Ended</span><input class="in" type="time" id="fEnd" value="${hhmm(now)}"></label></div>`;
  }
  const noteLabel = type === "repair" ? "What was fixed" : type === "other" ? "What was it for" : "Note <em>(optional)</em>";
  body += `<label class="f"><span>${noteLabel}</span><input class="in" id="fNote" placeholder="${type==="repair"?"Air line fitting":type==="other"?"Overnight parking":"Station, gate, anything useful"}"></label>`;
  body += `<div id="noReceipt"></div>`;
  if (T.money) body += `<div class="toggle"><span>Personal expense<br><small style="color:var(--muted)">Not counted in business totals</small></span><input type="checkbox" id="fPersonal"></div>`;
  body += `<button class="save" id="fSave" disabled>Save ${T.label.toLowerCase()}</button><div class="need" id="fNeed"></div>`;
  openSheet(T.label, body);

  const sb = $("#shBody");
  sb.querySelectorAll(".ph").forEach(slot => {
    const input = slot.querySelector("input");
    input.onchange = async () => {
      const file = input.files && input.files[0]; if (!file) return;
      try {
        const url = await compress(file);
        f.photos[slot.dataset.key] = url;
        slot.classList.add("has");
        slot.querySelectorAll("img,.re").forEach(n => n.remove());
        slot.insertAdjacentHTML("afterbegin", `<img alt=""><span class="re">Retake</span>`);
        slot.querySelector("img").src = url;
        check();
      } catch { toast("That photo couldn't be read. Try taking it again."); }
    };
  });
  sb.querySelectorAll("input:not([type=file])").forEach(i => i.addEventListener("input", check));
  const amt = $("#fAmt"); if (amt) setTimeout(() => amt.focus(), 250);

  function vals(){
    const v = {
      amount: amt ? parseFloat(String(amt.value).replace(/[^0-9.]/g,"")) : null,
      note: ($("#fNote")?.value || "").trim(),
      load: ($("#fLoad")?.value || "").trim(),
      location: ($("#fLoc")?.value || "").trim(),
      personal: !!$("#fPersonal")?.checked
    };
    if (type === "delay"){
      const [sh,sm] = ($("#fStart").value||"").split(":").map(Number), [eh,em] = ($("#fEnd").value||"").split(":").map(Number);
      const s = new Date(); s.setHours(sh,sm,0,0); const e = new Date(); e.setHours(eh,em,0,0);
      if (e < s) s.setDate(s.getDate()-1);
      v.start = s.getTime(); v.mins = isNaN(sh)||isNaN(eh) ? NaN : Math.round((e - s)/6e4);
    }
    return v;
  }
  function check(){
    const v = vals(); const need = [];
    if (T.money && !(v.amount > 0)) need.push("an amount");
    if ((type === "repair" || type === "other") && !v.note) need.push(type === "repair" ? "what was fixed" : "what it was for");
    if (type === "delay"){ if (!v.location) need.push("where"); if (!(v.mins > 0)) need.push("a start and end time"); }
    const needsReceipt = (type === "diesel" || type === "repair") && !f.photos.receipt && !v.personal;
    $("#noReceipt").innerHTML = needsReceipt ? `<div class="hint">No receipt photo? Add a note saying why. It will be flagged for owner review.</div>` : "";
    if (needsReceipt && !v.note && type === "diesel") need.push("a receipt photo or a note");
    $("#fSave").disabled = need.length > 0;
    $("#fNeed").textContent = need.length ? "Still needs " + need.join(", ") : "";
  }
  check();

  $("#fSave").onclick = async () => {
    const v = vals(); const btn = $("#fSave"); btn.disabled = true; btn.textContent = "Saving…";
    const e = {
      id: uid(), type, at: type === "delay" ? v.start : Date.now(), createdAt: Date.now(),
      amount: T.money ? Math.round(v.amount*100)/100 : null,
      note: v.note || null, load: v.load || null, location: v.location || null,
      mins: type === "delay" ? v.mins : null, personal: v.personal,
      receipt: f.photos.receipt || null, odometer: f.photos.odometer || null, proof: f.photos.proof || null,
      review: (type === "diesel" || type === "repair") && !f.photos.receipt && !v.personal
    };
    try {
      await saveEntry(e);
      closeSheet();
      if (period === "day" && !inPeriod(e)) period = "week";
      render();
      const box = $(T.money ? "#totalBox" : "#deliv").closest(".stat");
      box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
      toast(`${T.label} saved`);
    } catch (err) {
      btn.textContent = `Save ${T.label.toLowerCase()}`; btn.disabled = false;
      toast(err && err.message && !err.code ? err.message : "Couldn't save. Check your signal and tap Save again.");
    }
  };
}

/* Shrink photos so they stay small enough to store */
function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      let max = 900, q = .62, out;
      for (let i = 0; i < 4; i++){
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 110000) break;
        max = Math.round(max*.75); q -= .08;
      }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}

/* ---------- Detail, receipts, other tiles ---------- */
function openDetail(id){
  const e = entries.find(x => x.id === id); if (!e) return;
  const T = TYPES[e.type] || TYPES.other;
  const rows = [["When", `${fmtDay(e.at)}, ${fmtTime(e.at)}`]];
  if (T.money) rows.push(["Amount", usd.format(Number(e.amount)||0)]);
  if (e.type === "delay") rows.push(["Waited", fmtMins(e.mins||0)]);
  if (e.load) rows.push(["Load", e.load]);
  if (e.location) rows.push(["Where", e.location]);
  if (e.note) rows.push([e.type === "repair" ? "Fixed" : "Note", e.note]);
  if (e.personal) rows.push(["Type", "Personal, not in totals"]);
  if (e.review) rows.push(["Status", "Needs owner review (no receipt)"]);
  const pics = [["Receipt", e.receipt], ["Odometer", e.odometer], ["Signed delivery", e.proof]].filter(p => p[1]);
  openSheet(T.label, `<div class="detail"><dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="big">${pics.map((p,i) => `<div class="day">${esc(p[0])}</div><img data-i="${i}" alt="${esc(p[0])} photo">`).join("")}</div>
    <button class="del" id="del">Delete entry</button></div>`);
  $("#shBody").querySelectorAll(".big img").forEach(im => im.src = pics[+im.dataset.i][1]);
  let armed = false;
  $("#del").onclick = async () => {
    if (!armed){ armed = true; $("#del").textContent = "Tap again to delete"; return; }
    try { await deleteEntry(e.id); closeSheet(); toast("Entry deleted"); } catch { toast("Couldn't delete. Try again."); }
  };
}
function openReceipts(){
  const pics = [];
  entries.slice().sort((a,b) => b.at - a.at).forEach(e => [e.receipt, e.odometer, e.proof].forEach(p => p && pics.push({p, id:e.id})));
  if (!pics.length){ openSheet("Receipts", `<div class="empty">No photos yet. Receipts you add when logging show up here.</div>`); return; }
  openSheet("Receipts", `<div class="gallery">${pics.map((x,i) => `<button data-id="${esc(x.id)}" aria-label="Open entry"><img data-i="${i}" alt=""></button>`).join("")}</div>`);
  $("#shBody").querySelectorAll(".gallery img").forEach(im => im.src = pics[+im.dataset.i].p);
  $("#shBody").querySelectorAll(".gallery button").forEach(b => b.onclick = () => openDetail(b.dataset.id));
}

$("#logBtn").onclick = openPicker;
$("#tReceipts").onclick = openReceipts;
document.querySelectorAll("[data-later]").forEach(b => b.onclick = () => toast(`${b.dataset.later} is planned for a later sprint`));
$("#pDay").onclick = () => { period = "day"; render(); };
$("#pWeek").onclick = () => { period = "week"; render(); };
$("#list").addEventListener("click", ev => { const r = ev.target.closest(".row"); if (r) openDetail(r.dataset.id); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });

setSync(false); $("#sync").innerHTML = "<b>Connecting…</b>";
render();
connect();

/* Offline support when hosted on its own site (GitHub Pages) */
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
})();
